name: Build GPTFloatBall

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Force-write all project files
        run: |
          # ---- 根 Makefile ----
          cat > Makefile << 'MAKEEOF'
          export THEOS = $(CURDIR)/theos
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = SpringBoard
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = GPTFloatBall
          GPTFloatBall_FILES = Tweak.xm GPTChatViewController.m GPTSettings.m
          GPTFloatBall_FRAMEWORKS = UIKit Foundation CoreGraphics
          GPTFloatBall_CFLAGS = -fobjc-arc -Wno-deprecated-declarations
          GPTFloatBall_LIBRARIES = substrate
          include $(THEOS_MAKE_PATH)/tweak.mk
          SUBPROJECTS += prefs
          include $(THEOS_MAKE_PATH)/aggregate.mk
          after-install::
          	install.exec "killall -9 SpringBoard"
          MAKEEOF

          # ---- GPTChatViewController.m ----
          cat > GPTChatViewController.m << 'CHATEOF'
          #import "GPTChatViewController.h"
          #import "GPTSettings.h"
          @interface GPTChatViewController () <UITableViewDelegate, UITableViewDataSource, UITextFieldDelegate>
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) NSMutableArray *messages;
          @property (nonatomic, strong) UITextField *inputField;
          @property (nonatomic, strong) UIActivityIndicatorView *spinner;
          @end
          @implementation GPTChatViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"GPT 助手";
              self.view.backgroundColor = [UIColor systemBackgroundColor];
              self.navigationItem.leftBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemClose target:self action:@selector(close)];
              self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"清空" style:UIBarButtonItemStylePlain target:self action:@selector(clearAll)];
              self.messages = [NSMutableArray arrayWithArray:[GPTSettings chatHistory]];
              self.tableView = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStylePlain];
              self.tableView.delegate = self; self.tableView.dataSource = self; self.tableView.rowHeight = UITableViewAutomaticDimension; self.tableView.estimatedRowHeight = 60;
              self.tableView.translatesAutoresizingMaskIntoConstraints = NO; [self.view addSubview:self.tableView];
              UIView *inputBar = [UIView new]; inputBar.backgroundColor = [UIColor secondarySystemBackgroundColor];
              inputBar.translatesAutoresizingMaskIntoConstraints = NO; [self.view addSubview:inputBar];
              self.inputField = [UITextField new]; self.inputField.placeholder = @"输入消息...";
              self.inputField.borderStyle = UITextBorderStyleRoundedRect; self.inputField.delegate = self;
              self.inputField.returnKeyType = UIReturnKeySend; self.inputField.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:self.inputField];
              UIButton *sendBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [sendBtn setTitle:@"发送" forState:UIControlStateNormal];
              [sendBtn addTarget:self action:@selector(sendMessage) forControlEvents:UIControlEventTouchUpInside];
              sendBtn.translatesAutoresizingMaskIntoConstraints = NO; [inputBar addSubview:sendBtn];
              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.hidesWhenStopped = YES; self.spinner.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:self.spinner];
              [NSLayoutConstraint activateConstraints:@[
                  [self.tableView.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor],
                  [self.tableView.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [self.tableView.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [self.tableView.bottomAnchor constraintEqualToAnchor:inputBar.topAnchor],
                  [inputBar.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [inputBar.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [inputBar.bottomAnchor constraintEqualToAnchor:self.view.bottomAnchor],
                  [inputBar.heightAnchor constraintEqualToConstant:60],
                  [self.inputField.leadingAnchor constraintEqualToAnchor:inputBar.leadingAnchor constant:12],
                  [self.inputField.centerYAnchor constraintEqualToAnchor:inputBar.centerYAnchor constant:-10],
                  [self.inputField.trailingAnchor constraintEqualToAnchor:sendBtn.leadingAnchor constant:-8],
                  [sendBtn.trailingAnchor constraintEqualToAnchor:inputBar.trailingAnchor constant:-12],
                  [sendBtn.centerYAnchor constraintEqualToAnchor:self.inputField.centerYAnchor],
                  [sendBtn.widthAnchor constraintEqualToConstant:60],
                  [self.spinner.centerXAnchor constraintEqualToAnchor:inputBar.centerXAnchor],
                  [self.spinner.bottomAnchor constraintEqualToAnchor:inputBar.bottomAnchor constant:-4],
              ]];
              [self scrollToBottom];
          }
          - (void)close { if (self.dismissBlock) self.dismissBlock(); }
          - (void)clearAll { [self.messages removeAllObjects]; [GPTSettings clearHistory]; [self.tableView reloadData]; }
          - (void)scrollToBottom {
              if (self.messages.count == 0) return;
              NSIndexPath *last = [NSIndexPath indexPathForRow:self.messages.count - 1 inSection:0];
              [self.tableView scrollToRowAtIndexPath:last atScrollPosition:UITableViewScrollPositionBottom animated:YES];
          }
          - (void)sendMessage {
              NSString *text = [self.inputField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (text.length == 0) return;
              NSString *apiKey = [GPTSettings apiKey];
              if (apiKey.length == 0) {
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"未配置" message:@"请先在设置中填写 API Key" preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil]; return;
              }
              self.inputField.text = @"";
              [self.messages addObject:@{@"role": @"user", @"content": text}];
              [self.tableView reloadData]; [self scrollToBottom]; [self.spinner startAnimating];
              NSMutableArray *apiMessages = [NSMutableArray array];
              [apiMessages addObject:@{@"role": @"system", @"content": [GPTSettings systemPrompt]}];
              for (NSDictionary *msg in self.messages) { [apiMessages addObject:msg]; }
              NSDictionary *body = @{ @"model": [GPTSettings modelName], @"messages": apiMessages, @"temperature": @([GPTSettings temperature]), @"max_tokens": @([GPTSettings maxTokens]) };
              NSURL *url = [NSURL URLWithString:[GPTSettings apiBaseURL]];
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:url];
              request.HTTPMethod = @"POST";
              [request setValue:@"application/json" forHTTPHeaderField:@"Content-Type"];
              [request setValue:[NSString stringWithFormat:@"Bearer %@", apiKey] forHTTPHeaderField:@"Authorization"];
              request.HTTPBody = [NSJSONSerialization dataWithJSONObject:body options:0 error:nil];
              request.timeoutInterval = 60;
              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.spinner stopAnimating];
                      if (error) {
                          [self.messages addObject:@{@"role": @"assistant", @"content": [NSString stringWithFormat:@"请求失败: %@", error.localizedDescription]}];
                          [self.tableView reloadData]; [self scrollToBottom]; return;
                      }
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSString *reply = nil;
                      if (json[@"choices"] && [json[@"choices"] count] > 0) reply = json[@"choices"][0][@"message"][@"content"];
                      else if (json[@"error"]) reply = [NSString stringWithFormat:@"API错误: %@", json[@"error"][@"message"]];
                      if (reply.length > 0) {
                          [self.messages addObject:@{@"role": @"assistant", @"content": reply}];
                          [GPTSettings saveChatHistory:self.messages];
                      } else {
                          [self.messages addObject:@{@"role": @"assistant", @"content": @"未收到有效回复"}];
                      }
                      [self.tableView reloadData]; [self scrollToBottom];
                  });
              }]; [task resume];
          }
          - (BOOL)textFieldShouldReturn:(UITextField *)textField { [self sendMessage]; return YES; }
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return self.messages.count; }
          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              static NSString *cellID = @"ChatCell";
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:cellID];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:cellID];
                  cell.textLabel.numberOfLines = 0; cell.textLabel.font = [UIFont systemFontOfSize:15];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;
              }
              NSDictionary *msg = self.messages[indexPath.row];
              BOOL isUser = [msg[@"role"] isEqualToString:@"user"];
              cell.textLabel.text = isUser ? [NSString stringWithFormat:@"你: %@", msg[@"content"]] : [NSString stringWithFormat:@"GPT: %@", msg[@"content"]];
              cell.textLabel.textColor = isUser ? [UIColor systemBlueColor] : [UIColor labelColor];
              return cell;
          }
          @end
          CHATEOF

          # ---- prefs 目录 ----
          mkdir -p prefs/Resources

          cat > prefs/Makefile << 'PMEOF'
          include $(THEOS)/makefiles/common.mk
          BUNDLE_NAME = GPTFloatBallPrefs
          GPTFloatBallPrefs_FILES = GPTFloatBallPrefsRootListController.m
          GPTFloatBallPrefs_INSTALL_PATH = /Library/PreferenceBundles
          GPTFloatBallPrefs_FRAMEWORKS = UIKit
          GPTFloatBallPrefs_CFLAGS = -fobjc-arc
          GPTFloatBallPrefs_LDFLAGS = -Wl,-undefined,dynamic_lookup
          include $(THEOS_MAKE_PATH)/bundle.mk
          internal-stage::
          	$(ECHO_NOTHING)mkdir -p $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences$(ECHO_END)
          	$(ECHO_NOTHING)cp entry.plist $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences/GPTFloatBall.plist$(ECHO_END)
          PMEOF

          cat > prefs/entry.plist << 'ENTEOF'
          {
              entry = {
                  bundle = "GPTFloatBallPrefs";
                  cell = PSLinkCell;
                  detail = "GPTFloatBallPrefsRootListController";
                  icon = "ball_icon.png";
                  isController = 1;
                  label = "GPT悬浮球";
              };
          }
          ENTEOF

          cat > prefs/Resources/Info.plist << 'INFOEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>com.yourname.gptfloatball.prefs</string>
              <key>CFBundleName</key><string>GPTFloatBallPrefs</string>
              <key>CFBundlePackageType</key><string>BNDL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1.0.0</string>
          </dict>
          </plist>
          INFOEOF

          cat > prefs/Resources/Root.plist << 'ROOTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>基本设置</string></dict>
                  <dict>
                      <key>cell</key><string>PSSwitchCell</string>
                      <key>default</key><true/>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>enabled</string>
                      <key>label</key><string>启用悬浮球</string>
                  </dict>
                  <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>API 配置</string><key>footerText</key><string>支持 OpenAI 及兼容接口，填好 Key 和地址即可点“模型”自动获取</string></dict>
                  <dict>
                      <key>cell</key><string>PSEditTextCell</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>apiKey</string>
                      <key>label</key><string>API Key</string>
                      <key>placeholder</key><string>sk-xxxxxxxx</string>
                      <key>get</key><string>readPreferenceValue:</string>
                      <key>set</key><string>setPreferenceValue:specifier:</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSEditTextCell</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>apiBaseURL</string>
                      <key>label</key><string>API 地址</string>
                      <key>placeholder</key><string>https://api.deepseek.com/v1/chat/completions</string>
                      <key>get</key><string>readPreferenceValue:</string>
                      <key>set</key><string>setPreferenceValue:specifier:</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSLinkCell</string>
                      <key>detail</key><string>GPTModelSelectController</string>
                      <key>label</key><string>模型</string>
                      <key>key</key><string>modelName</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSEditTextCell</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>systemPrompt</string>
                      <key>label</key><string>角色预设</string>
                      <key>placeholder</key><string>你是一个简洁的AI助手，用中文回答。</string>
                      <key>get</key><string>readPreferenceValue:</string>
                      <key>set</key><string>setPreferenceValue:specifier:</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSEditTextCell</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>temperature</string>
                      <key>label</key><string>温度</string>
                      <key>placeholder</key><string>0.7</string>
                      <key>get</key><string>readPreferenceValue:</string>
                      <key>set</key><string>setPreferenceValue:specifier:</string>
                  </dict>
                  <dict>
                      <key>cell</key><string>PSEditTextCell</string>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>maxTokens</string>
                      <key>label</key><string>最大 tokens</string>
                      <key>placeholder</key><string>1024</string>
                      <key>get</key><string>readPreferenceValue:</string>
                      <key>set</key><string>setPreferenceValue:specifier:</string>
                  </dict>
                  <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>图标设置</string></dict>
                  <dict>
                      <key>cell</key><string>PSButtonCell</string>
                      <key>label</key><string>从相册选择悬浮球图标</string>
                      <key>action</key><string>pickImage</string>
                  </dict>
                  <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>数据管理</string></dict>
                  <dict>
                      <key>cell</key><string>PSButtonCell</string>
                      <key>label</key><string>清除对话记录</string>
                      <key>action</key><string>clearHistory</string>
                  </dict>
              </array>
              <key>title</key><string>GPT悬浮球</string>
          </dict>
          </plist>
          ROOTEOF

          cat > prefs/GPTFloatBallPrefsRootListController.m << 'CTLEOF'
          #import <Preferences/PSListController.h>
          #import <Preferences/PSSpecifier.h>
          #import <spawn.h>
          #import <UIKit/UIKit.h>

          #define kPrefsDomain @"com.yourname.gptfloatball"
          #define kPrefsPlist @"/var/mobile/Library/Preferences/com.yourname.gptfloatball.plist"
          #define kIconPath @"/var/mobile/Library/Preferences/GPTFloatBall_icon.png"

          // ========== 动态模型选择页面 ==========
          @interface GPTModelSelectController : PSListController
          @property (nonatomic, strong) NSMutableArray *modelList;
          @end

          @implementation GPTModelSelectController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"选择模型";
              self.modelList = [NSMutableArray array];
              
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [self fetchModels];
              });
          }

          - (void)fetchModels {
              NSUserDefaults *ud = [[NSUserDefaults alloc] initWithSuiteName:kPrefsDomain];
              [ud synchronize];

              NSString *apiKey = [ud stringForKey:@"apiKey"];
              NSString *baseURL = [ud stringForKey:@"apiBaseURL"];

              if (!baseURL || baseURL.length == 0) {
                  baseURL = @"https://api.deepseek.com/v1/chat/completions";
              }

              if (!apiKey || apiKey.length == 0) {
                  [self showError:@"请先返回上一页填写 API Key，然后再点进来。" autoPop:YES];
                  return;
              }

              NSString *modelsURL = baseURL;
              if ([modelsURL containsString:@"/chat/completions"]) {
                  modelsURL = [modelsURL stringByReplacingOccurrencesOfString:@"/chat/completions" withString:@"/models"];
              } else if ([modelsURL hasSuffix:@"/"]) {
                  modelsURL = [modelsURL stringByAppendingString:@"models"];
              } else {
                  modelsURL = [modelsURL stringByAppendingString:@"/models"];
              }

              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:modelsURL]];
              req.HTTPMethod = @"GET";
              [req setValue:[NSString stringWithFormat:@"Bearer %@", apiKey] forHTTPHeaderField:@"Authorization"];
              req.timeoutInterval = 15;

              UIActivityIndicatorView *spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              spinner.center = self.view.center;
              [spinner startAnimating];
              [self.view addSubview:spinner];

              [[[NSURLSession sharedSession] dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [spinner removeFromSuperview];
                      if (error) { [self showError:error.localizedDescription autoPop:NO]; return; }

                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSArray *dataArray = json[@"data"];

                      [self.modelList removeAllObjects];
                      if (dataArray && [dataArray isKindOfClass:[NSArray class]]) {
                          for (NSDictionary *model in dataArray) {
                              NSString *modelID = model[@"id"];
                              if (modelID.length > 0) {
                                  [self.modelList addObject:modelID];
                              }
                          }
                          [self reloadSpecifiers];
                      } else {
                          [self showError:@"获取模型失败，请检查 API 地址和 Key" autoPop:NO];
                      }
                  });
              }] resume];
          }

          - (NSArray *)specifiers {
              if (!_specifiers) {
                  _specifiers = [NSMutableArray array];
              }
              [(NSMutableArray *)_specifiers removeAllObjects];

              NSDictionary *prefs = [NSDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: @{};
              NSString *currentModel = prefs[@"modelName"] ?: @"";

              if (self.modelList.count == 0) {
                  PSSpecifier *loading = [PSSpecifier preferenceSpecifierNamed:@"正在自动获取模型..." target:self set:nil get:nil detail:nil cell:PSStaticTextCell edit:nil];
                  [(NSMutableArray *)_specifiers addObject:loading];
              } else {
                  for (NSString *model in self.modelList) {
                      PSSpecifier *spec = [PSSpecifier preferenceSpecifierNamed:model target:self set:nil get:nil detail:nil cell:PSListItemCell edit:nil];
                      [spec setProperty:model forKey:@"modelID"];
                      if ([model isEqualToString:currentModel]) {
                          [spec setProperty:@YES forKey:@"isSelected"];
                      }
                      [(NSMutableArray *)_specifiers addObject:spec];
                  }
              }
              return _specifiers;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              PSSpecifier *spec = [self specifierAtIndexPath:indexPath];
              NSString *modelID = [spec propertyForKey:@"modelID"];
              if (modelID.length == 0) return;

              NSMutableDictionary *prefs = [NSMutableDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: [NSMutableDictionary new];
              prefs[@"modelName"] = modelID;
              [prefs writeToFile:kPrefsPlist atomically:YES];

              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
              [self.navigationController popViewControllerAnimated:YES];
          }

          - (void)showError:(NSString *)msg autoPop:(BOOL)autoPop {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"提示" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  if (autoPop) [self.navigationController popViewControllerAnimated:YES];
              }]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          @end

          // ========== 主设置页面 ==========
          @interface GPTFloatBallPrefsRootListController : PSListController <UIImagePickerControllerDelegate, UINavigationControllerDelegate>
          @end

          @implementation GPTFloatBallPrefsRootListController
          - (NSArray *)specifiers {
              if (!_specifiers) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc]
                  initWithTitle:@"应用更改" style:UIBarButtonItemStyleDone target:self action:@selector(apply)];
          }

          - (void)apply {
              [self.view endEditing:YES];
              NSUserDefaults *ud = [[NSUserDefaults alloc] initWithSuiteName:kPrefsDomain];
              [ud synchronize];

              CFNotificationCenterPostNotification(
                  CFNotificationCenterGetDarwinNotifyCenter(),
                  CFSTR("com.yourname.gptfloatball/settingsChanged"),
                  NULL, NULL, YES);

              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"保存成功" message:@"设置已生效，悬浮球已自动刷新。" preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          // ========== 核心修复：让输入框正确读取和保存 ==========
          - (id)readPreferenceValue:(PSSpecifier *)specifier {
              NSDictionary *prefs = [NSDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: @{};
              NSString *key = [specifier propertyForKey:@"key"];
              if (!key) return nil;
              id val = prefs[key];
              if (!val) val = [specifier propertyForKey:@"default"];
              return val;
          }

          - (void)setPreferenceValue:(id)value specifier:(PSSpecifier *)specifier {
              NSString *key = [specifier propertyForKey:@"key"];
              if (!key) return;
              NSMutableDictionary *prefs = [NSMutableDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: [NSMutableDictionary new];
              prefs[key] = value;
              [prefs writeToFile:kPrefsPlist atomically:YES];
              // 每次输入立即生效，无需点应用更改
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
          }
          // =======================================================

          - (void)pickImage {
              UIImagePickerController *picker = [[UIImagePickerController alloc] init];
              picker.sourceType = UIImagePickerControllerSourceTypePhotoLibrary;
              picker.delegate = self;
              picker.allowsEditing = YES;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)imagePickerController:(UIImagePickerController *)picker didFinishPickingMediaWithInfo:(NSDictionary<UIImagePickerControllerInfoKey,id> *)info {
              UIImage *image = info[UIImagePickerControllerEditedImage] ?: info[UIImagePickerControllerOriginalImage];
              [picker dismissViewControllerAnimated:YES completion:^{
                  if (!image) return;
                  UIGraphicsBeginImageContextWithOptions(CGSizeMake(128, 128), NO, 1.0);
                  [image drawInRect:CGRectMake(0, 0, 128, 128)];
                  UIImage *scaled = UIGraphicsGetImageFromCurrentImageContext();
                  UIGraphicsEndImageContext();
                  NSData *data = UIImagePNGRepresentation(scaled);
                  [data writeToFile:kIconPath atomically:YES];
                  NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: [NSMutableDictionary new];
                  dict[@"iconPath"] = kIconPath;
                  [dict writeToFile:kPrefsPlist atomically:YES];
                  CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"成功" message:@"图标已更新，悬浮球会自动刷新" preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
              }];
          }

          - (void)imagePickerControllerDidCancel:(UIImagePickerController *)picker {
              [picker dismissViewControllerAnimated:YES completion:nil];
          }

          - (void)clearHistory {
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:kPrefsPlist] ?: [NSMutableDictionary new];
              [dict removeObjectForKey:@"chatHistory"];
              [dict writeToFile:kPrefsPlist atomically:YES];
              [self apply];
          }
          @end
          CTLEOF

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build package
        run: |
          mkdir -p packages
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          find ${{ github.workspace }} -name "*.deb" -type f

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: GPTFloatBall-deb
          path: ${{ github.workspace }}/packages/*.deb
