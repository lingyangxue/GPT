name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Kill prefs subproject
        run: |
          rm -rf prefs
          sed -i '' '/SUBPROJECTS += prefs/d' Makefile
          sed -i '' '/aggregate.mk/d' Makefile
          grep -n "GPTFloatBall_FILES" Makefile
          grep -n "SUBPROJECTS" Makefile || echo "no subprojects - OK"
          cat Makefile

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-v11

      - name: Theos
        uses: huami1314/theos-action@main

      - name: GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GPTFloatBall-deb
          path: packages/*.deb
