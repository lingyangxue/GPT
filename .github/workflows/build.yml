name: Build GPTFloatBall

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Force-write all project files
        run: |
          # ---- 根 Makefile ----
          cat > Makefile << 'MAKEEOF'
          export THEOS = $(CURDIR)/theos
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = SpringBoard
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = GPTFloatBall
          GPTFloatBall_FILES = Tweak.xm GPTChatViewController.m GPTSettings.m
          GPTFloatBall_FRAMEWORKS = UIKit Foundation CoreGraphics
          GPTFloatBall_CFLAGS = -fobjc-arc -Wno-deprecated-declarations
          GPTFloatBall_LIBRARIES = substrate
          include $(THEOS_MAKE_PATH)/tweak.mk
          SUBPROJECTS += prefs
          include $(THEOS_MAKE_PATH)/aggregate.mk
          after-install::
          	install.exec "killall -9 SpringBoard"
          MAKEEOF

          # ---- GPTFloatBall.plist（只注入 SpringBoard） ----
          cat > GPTFloatBall.plist << 'PLEOF'
          { Filter = { Bundles = ( "com.apple.springboard" ); }; }
          PLEOF

          # ---- Tweak.xm（悬浮球 + UIWindowScene 修复） ----
          cat > Tweak.xm << 'TWEAKEOF'
          #import <UIKit/UIKit.h>
          #import <roothide.h>
          #import "GPTSettings.h"
          #import "GPTChatViewController.h"

          static UIWindow *gFloatWindow = nil;
          static UIButton *gFloatButton = nil;

          static UIImage *getBallIcon(void) {
              NSString *customPath = [GPTSettings iconPath];
              if (customPath && [[NSFileManager defaultManager] fileExistsAtPath:customPath]) {
                  UIImage *img = [UIImage imageWithContentsOfFile:customPath];
                  if (img) return img;
              }
              NSString *defaultPath = jbroot(@"/Library/Application Support/GPTFloatBall/ball_icon.png");
              UIImage *img = [UIImage imageWithContentsOfFile:defaultPath];
              return img;
          }

          static UIWindowScene *currentWindowScene(void) {
              for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                  if ([scene isKindOfClass:[UIWindowScene class]] && scene.activationState == UISceneActivationStateForegroundActive) {
                      return (UIWindowScene *)scene;
                  }
              }
              for (UIScene *scene in [UIApplication sharedApplication].connectedScenes) {
                  if ([scene isKindOfClass:[UIWindowScene class]]) {
                      return (UIWindowScene *)scene;
                  }
              }
              return nil;
          }

          @interface GPTFloatBallHandler : NSObject
          + (instancetype)shared;
          - (void)ballTapped;
          - (void)ballPanned:(UIPanGestureRecognizer *)pan;
          @end

          @implementation GPTFloatBallHandler
          + (instancetype)shared {
              static GPTFloatBallHandler *inst = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ inst = [[GPTFloatBallHandler alloc] init]; });
              return inst;
          }

          - (void)ballTapped {
              GPTChatViewController *chatVC = [[GPTChatViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:chatVC];
              UIWindowScene *scene = currentWindowScene();
              if (!scene) return;
              UIWindow *chatWindow = [[UIWindow alloc] initWithWindowScene:scene];
              chatWindow.frame = [UIScreen mainScreen].bounds;
              chatWindow.windowLevel = UIWindowLevelAlert + 100;
              chatWindow.rootViewController = nav;
              chatWindow.hidden = NO;
              static UIWindow *sChatWindow = nil;
              sChatWindow = chatWindow;
              chatVC.dismissBlock = ^{ sChatWindow.hidden = YES; sChatWindow = nil; };
          }

          - (void)ballPanned:(UIPanGestureRecognizer *)pan {
              UIView *ball = pan.view; UIWindow *win = ball.window;
              CGPoint translation = [pan translationInView:win];
              win.center = CGPointMake(win.center.x + translation.x, win.center.y + translation.y);
              [pan setTranslation:CGPointZero inView:win];
              if (pan.state == UIGestureRecognizerStateEnded) {
                  CGSize screen = [UIScreen mainScreen].bounds.size;
                  CGFloat x = win.frame.origin.x, y = win.frame.origin.y;
                  x = (x < screen.width / 2) ? 10 : (screen.width - 70);
                  y = MAX(60, MIN(y, screen.height - 120));
                  [UIView animateWithDuration:0.25 animations:^{ win.frame = CGRectMake(x, y, 60, 60); }];
                  NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                  [defaults setFloat:x forKey:@"ballX"]; [defaults setFloat:y forKey:@"ballY"]; [defaults synchronize];
              }
          }
          @end

          static void createFloatBall(void) {
              if (gFloatWindow) return;
              UIWindowScene *scene = currentWindowScene();
              if (!scene) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      createFloatBall();
                  });
                  return;
              }
              gFloatWindow = [[UIWindow alloc] initWithWindowScene:scene];
              gFloatWindow.frame = CGRectMake(0, 0, 60, 60);
              gFloatWindow.windowLevel = UIWindowLevelStatusBar + 100;
              gFloatWindow.backgroundColor = [UIColor clearColor];
              gFloatWindow.rootViewController = [UIViewController new];

              gFloatButton = [UIButton buttonWithType:UIButtonTypeCustom];
              gFloatButton.frame = CGRectMake(0, 0, 60, 60);
              gFloatButton.layer.cornerRadius = 30;
              gFloatButton.layer.masksToBounds = YES;
              gFloatButton.backgroundColor = [UIColor colorWithRed:0.1 green:0.45 blue:0.91 alpha:0.85];

              UIImage *icon = getBallIcon();
              if (icon) {
                  [gFloatButton setImage:icon forState:UIControlStateNormal];
                  gFloatButton.imageView.contentMode = UIViewContentModeScaleAspectFill;
              } else {
                  [gFloatButton setTitle:@"AI" forState:UIControlStateNormal];
                  gFloatButton.titleLabel.font = [UIFont boldSystemFontOfSize:18];
                  [gFloatButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              }

              gFloatButton.layer.shadowColor = [UIColor blackColor].CGColor;
              gFloatButton.layer.shadowOffset = CGSizeMake(0, 2);
              gFloatButton.layer.shadowOpacity = 0.3;
              gFloatButton.layer.shadowRadius = 4;
              gFloatButton.layer.masksToBounds = NO;

              [gFloatButton addTarget:[GPTFloatBallHandler shared] action:@selector(ballTapped) forControlEvents:UIControlEventTouchUpInside];
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:[GPTFloatBallHandler shared] action:@selector(ballPanned:)];
              [gFloatButton addGestureRecognizer:pan];
              [gFloatWindow.rootViewController.view addSubview:gFloatButton];

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              CGFloat savedX = [defaults floatForKey:@"ballX"];
              CGFloat savedY = [defaults floatForKey:@"ballY"];
              if (savedX == 0 && savedY == 0) {
                  CGSize screen = [UIScreen mainScreen].bounds.size;
                  savedX = screen.width - 80; savedY = screen.height / 2;
              }
              gFloatWindow.frame = CGRectMake(savedX, savedY, 60, 60);
              gFloatWindow.hidden = NO;
          }

          static void removeFloatBall(void) {
              if (gFloatWindow) { gFloatWindow.hidden = YES; gFloatWindow = nil; gFloatButton = nil; }
          }

          static void settingsChangedCallback(CFNotificationCenterRef center, void *observer, CFStringRef name, const void *object, CFDictionaryRef userInfo) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if ([GPTSettings isEnabled]) { removeFloatBall(); createFloatBall(); }
                  else { removeFloatBall(); }
              });
         STR }

          %ctor {
              %init(";
              if (![GPTSettings isEnabled])com return;
              dispatch_after(dispatch_time.y(DISPATCH_TIME_NOW, (ourint64_t)(3.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ createFloatBall(); });
              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, settingsChangedCallback, CFname.gptfloatball/settingsChanged"), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
          }
          TWEAKEOF

          # ---- GPTChatViewController.h ----
          cat > GPTChatViewController.h << 'CHATEOF'
          #import <UIKit/UIKit.h>
          @interface GPTChatViewController : UIViewController
          @property (nonatomic, copy) void (^dismissBlock)(void);
          @end
          CHATEOF

          # ---- GPTChatViewController.m（含润色按钮） ----
          cat > GPTChatViewController.m << 'CHATM'
          #import "GPTChatViewController.h"
          #import "GPTSettings.h"

          @interface GPTChatViewController () <UITableViewDelegate, UITableViewDataSource, UITextFieldDelegate>
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) NSMutableArray *messages;
          @property (nonatomic, strong) UITextField *inputField;
          @property (nonatomic, strong) UIActivityIndicatorView *spinner;
          @end

          @implementation GPTChatViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"GPT 助手";
              self.view.backgroundColor = [UIColor systemBackgroundColor];
              self.navigationItem.leftBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemClose target:self action:@selector(close)];
              self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"清空" style:UIBarButtonItemStylePlain target:self action:@selector(clearAll)];
              self.messages = [NSMutableArray arrayWithArray:[GPTSettings chatHistory]];

              self.tableView = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStylePlain];
              self.tableView.delegate = self; self.tableView.dataSource = self;
              self.tableView.rowHeight = UITableViewAutomaticDimension; self.tableView.estimatedRowHeight = 60;
              self.tableView.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.tableView];

              UIView *inputBar = [UIView new];
              inputBar.backgroundColor = [UIColor secondarySystemBackgroundColor];
              inputBar.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:inputBar];

              self.inputField = [UITextField new];
              self.inputField.placeholder = @"输入消息...";
              self.inputField.borderStyle = UITextBorderStyleRoundedRect;
              self.inputField.delegate = self;
              self.inputField.returnKeyType = UIReturnKeySend;
              self.inputField.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:self.inputField];

              UIButton *polishBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [polishBtn setTitle:@"润色" forState:UIControlStateNormal];
              [polishBtn setTitleColor:[UIColor systemBlueColor] forState:UIControlStateNormal];
              polishBtn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [polishBtn addTarget:self action:@selector(polishText) forControlEvents:UIControlEventTouchUpInside];
              polishBtn.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:polishBtn];

              UIButton *sendBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [sendBtn setTitle:@"发送" forState:UIControlStateNormal];
              [sendBtn setTitleColor:[UIColor systemBlueColor] forState:UIControlStateNormal];
              sendBtn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [sendBtn addTarget:self action:@selector(sendMessage) forControlEvents:UIControlEventTouchUpInside];
              sendBtn.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:sendBtn];

              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.hidesWhenStopped = YES;
              self.spinner.translatesAutoresizingMaskIntoConstraints = NO;
              [inputBar addSubview:self.spinner];

              [NSLayoutConstraint activateConstraints:@[
                  [self.tableView.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor],
                  [self.tableView.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [self.tableView.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [self.tableView.bottomAnchor constraintEqualToAnchor:inputBar.topAnchor],

                  [inputBar.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [inputBar.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [inputBar.bottomAnchor constraintEqualToAnchor:self.view.bottomAnchor],
                  [inputBar.heightAnchor constraintEqualToConstant:60],

                  [self.inputField.leadingAnchor constraintEqualToAnchor:inputBar.leadingAnchor constant:12],
                  [self.inputField.centerYAnchor constraintEqualToAnchor:inputBar.centerYAnchor constant:-10],
                  [self.inputField.trailingAnchor constraintEqualToAnchor:polishBtn.leadingAnchor constant:-4],

                  [polishBtn.trailingAnchor constraintEqualToAnchor:sendBtn.leadingAnchor constant:-4],
                  [polishBtn.centerYAnchor constraintEqualToAnchor:self.inputField.centerYAnchor],
                  [polishBtn.widthAnchor constraintEqualToConstant:48],

                  [sendBtn.trailingAnchor constraintEqualToAnchor:inputBar.trailingAnchor constant:-12],
                  [sendBtn.centerYAnchor constraintEqualToAnchor:self.inputField.centerYAnchor],
                  [sendBtn.widthAnchor constraintEqualToConstant:48],

                  [self.spinner.centerXAnchor constraintEqualToAnchor:inputBar.centerXAnchor],
                  [self.spinner.bottomAnchor constraintEqualToAnchor:inputBar.bottomAnchor constant:-4],
              ]];
              [self scrollToBottom];
          }

          - (void)close { if (self.dismissBlock) self.dismissBlock(); }
          - (void)clearAll { [self.messages removeAllObjects]; [GPTSettings clearHistory]; [self.tableView reloadData]; }
          - (void)scrollToBottom {
              if (self.messages.count == 0) return;
              NSIndexPath *last = [NSIndexPath indexPathForRow:self.messages.count - 1 inSection:0];
              [self.tableView scrollToRowAtIndexPath:last atScrollPosition:UITableViewScrollPositionBottom animated:YES];
          }

          - (void)polishText {
              NSString *text = [self.inputField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (text.length == 0) { [self showAlert:@"请先输入要润色的文字"]; return; }
              NSString *apiKey = [GPTSettings apiKey];
              if (apiKey.length == 0) { [self showAlert:@"请先在设置中填写 API Key"]; return; }

              [self.spinner startAnimating];
              self.inputField.text = @"";
              NSArray *apiMessages = @[
                  @{@"role": @"system", @"content": @"你是一个专业的中文润色助手。请对用户提供的文本进行润色，使其更通顺、优美、专业，只返回润色后的文本，不要添加任何解释或对话。"},
                  @{@"role": @"user", @"content": text}
              ];
              NSDictionary *body = @{ @"model": [GPTSettings modelName], @"messages": apiMessages, @"temperature": @([GPTSettings temperature]), @"max_tokens": @([GPTSettings maxTokens]) };
              NSURL *url = [NSURL URLWithString:[GPTSettings apiBaseURL]];
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:url];
              request.HTTPMethod = @"POST";
              [request setValue:@"application/json" forHTTPHeaderField:@"Content-Type"];
              [request setValue:[NSString stringWithFormat:@"Bearer %@", apiKey] forHTTPHeaderField:@"Authorization"];
              request.HTTPBody = [NSJSONSerialization dataWithJSONObject:body options:0 error:nil];
              request.timeoutInterval = 60;

              [[[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.spinner stopAnimating];
                      if (error) { [self showAlert:[NSString stringWithFormat:@"请求失败: %@", error.localizedDescription]]; return; }
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSString *reply = json[@"choices"][0][@"message"][@"content"];
                      if (reply.length > 0) {
                          self.inputField.text = reply;
                          [self.inputField becomeFirstResponder];
                      } else {
                          [self showAlert:@"润色失败，请检查 API 配置"];
                      }
                  });
              }] resume];
          }

          - (void)sendMessage {
              NSString *text = [self.inputField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (text.length == 0) return;
              NSString *apiKey = [GPTSettings apiKey];
              if (apiKey.length == 0) { [self showAlert:@"请先在设置中填写 API Key"]; return; }

              self.inputField.text = @"";
              [self.messages addObject:@{@"role": @"user", @"content": text}];
              [self.tableView reloadData]; [self scrollToBottom]; [self.spinner startAnimating];

              NSMutableArray *apiMessages = [NSMutableArray array];
              [apiMessages addObject:@{@"role": @"system", @"content": [GPTSettings systemPrompt]}];
              for (NSDictionary *msg in self.messages) { [apiMessages addObject:msg]; }
              NSDictionary *body = @{ @"model": [GPTSettings modelName], @"messages": apiMessages, @"temperature": @([GPTSettings temperature]), @"max_tokens": @([GPTSettings maxTokens]) };

              NSURL *url = [NSURL URLWithString:[GPTSettings apiBaseURL]];
              NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:url];
              request.HTTPMethod = @"POST";
              [request setValue:@"application/json" forHTTPHeaderField:@"Content-Type"];
              [request setValue:[NSString stringWithFormat:@"Bearer %@", apiKey] forHTTPHeaderField:@"Authorization"];
              request.HTTPBody = [NSJSONSerialization dataWithJSONObject:body options:0 error:nil];
              request.timeoutInterval = 60;

              [[[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self.spinner stopAnimating];
                      if (error) {
                          [self.messages addObject:@{@"role": @"assistant", @"content": [NSString stringWithFormat:@"请求失败: %@", error.localizedDescription]}];
                          [self.tableView reloadData]; [self scrollToBottom]; return;
                      }
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSString *reply = nil;
                      if (json[@"choices"] && [json[@"choices"] count] > 0) reply = json[@"choices"][0][@"message"][@"content"];
                      else if (json[@"error"]) reply = [NSString stringWithFormat:@"API错误: %@", json[@"error"][@"message"]];
                      if (reply.length > 0) {
                          [self.messages addObject:@{@"role": @"assistant", @"content": reply}];
                          [GPTSettings saveChatHistory:self.messages];
                      } else {
                          [self.messages addObject:@{@"role": @"assistant", @"content": @"未收到有效回复"}];
                      }
                      [self.tableView reloadData]; [self scrollToBottom];
                  });
              }] resume];
          }

          - (void)showAlert:(NSString *)msg {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"提示" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)textField { [self sendMessage]; return YES; }
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return self.messages.count; }
          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              static NSString *cellID = @"ChatCell";
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:cellID];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:cellID];
                  cell.textLabel.numberOfLines = 0; cell.textLabel.font = [UIFont systemFontOfSize:15];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;
              }
              NSDictionary *msg = self.messages[indexPath.row];
              BOOL isUser = [msg[@"role"] isEqualToString:@"user"];
              cell.textLabel.text = isUser ? [NSString stringWithFormat:@"你: %@", msg[@"content"]] : [NSString stringWithFormat:@"GPT: %@", msg[@"content"]];
              cell.textLabel.textColor = isUser ? [UIColor systemBlueColor] : [UIColor labelColor];
              return cell;
          }
          @end
          CHATM

          # ---- GPTSettings.h ----
          cat > GPTSettings.h << 'SETH'
          #import <Foundation/Foundation.h>
          #define kPrefsDomain @"com.yourname.gptfloatball"
          static inline NSString *prefsPath(void) {
              return @"/var/mobile/Library/Preferences/com.yourname.gptfloatball.plist";
          }
          @interface GPTSettings : NSObject
          + (BOOL)isEnabled;
          + (NSString *)apiKey;
          + (NSString *)apiBaseURL;
          + (NSString *)modelName;
          + (NSString *)iconPath;
          + (NSString *)systemPrompt;
          + (double)temperature;
          + (NSInteger)maxTokens;
          + (NSArray *)chatHistory;
          + (void)saveChatHistory:(NSArray *)history;
          + (void)clearHistory;
          @end
          SETH

          # ---- GPTSettings.m ----
          cat > GPTSettings.m << 'SETM'
          #import "GPTSettings.h"
          @implementation GPTSettings
          + (NSDictionary *)_readPrefs {
              NSDictionary *dict = [NSDictionary dictionaryWithContentsOfFile:prefsPath()];
              return dict ?: @{};
          }
          + (BOOL)isEnabled { NSNumber *v = [self _readPrefs][@"enabled"]; return v ? [v boolValue] : YES; }
          + (NSString *)apiKey { return [self _readPrefs][@"apiKey"] ?: @""; }
          + (NSString *)apiBaseURL {
              NSString *url = [self _readPrefs][@"apiBaseURL"];
              return url.length > 0 ? url : @"https://api.openai.com/v1/chat/completions";
          }
          + (NSString *)modelName {
              NSString *m = [self _readPrefs][@"modelName"];
              return m.length > 0 ? m : @"gpt-4o-mini";
          }
          + (NSString *)iconPath {
              NSString *p = [self _readPrefs][@"iconPath"];
              return p.length > 0 ? p : nil;
          }
          + (NSString *)systemPrompt {
              NSString *s = [self _readPrefs][@"systemPrompt"];
              return s.length > 0 ? s : @"你是一个简洁的AI助手，用中文回答。";
          }
          + (double)temperature {
              NSString *t = [self _readPrefs][@"temperature"];
              return t.length > 0 ? [t doubleValue] : 0.7;
          }
          + (NSInteger)maxTokens {
              NSString *t = [self _readPrefs][@"maxTokens"];
              return t.length > 0 ? [t integerValue] : 1024;
          }
          + (NSArray *)chatHistory { return [self _readPrefs][@"chatHistory"] ?: @[]; }
          + (void)saveChatHistory:(NSArray *)history {
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:prefsPath()] ?: [NSMutableDictionary new];
              dict[@"chatHistory"] = history;
              [dict writeToFile:prefsPath() atomically:YES];
          }
          + (void)clearHistory {
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:prefsPath()] ?: [NSMutableDictionary new];
              [dict removeObjectForKey:@"chatHistory"];
              [dict writeToFile:prefsPath() atomically:YES];
          }
          @end
          SETM

          # ---- prefs 目录 ----
          mkdir -p prefs/Resources

          cat > prefs/Makefile << 'PMEOF'
          include $(THEOS)/makefiles/common.mk
          BUNDLE_NAME = GPTFloatBallPrefs
          GPTFloatBallPrefs_FILES = GPTFloatBallPrefsRootListController.m
          GPTFloatBallPrefs_INSTALL_PATH = /Library/PreferenceBundles
          GPTFloatBallPrefs_FRAMEWORKS = UIKit
          GPTFloatBallPrefs_CFLAGS = -fobjc-arc
          GPTFloatBallPrefs_LDFLAGS = -Wl,-undefined,dynamic_lookup
          include $(THEOS_MAKE_PATH)/bundle.mk
          internal-stage::
          	$(ECHO_NOTHING)mkdir -p $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences$(ECHO_END)
          	$(ECHO_NOTHING)cp entry.plist $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences/GPTFloatBall.plist$(ECHO_END)
          PMEOF

          cat > prefs/entry.plist << 'ENTEOF'
          {
              entry = {
                  bundle = "GPTFloatBallPrefs";
                  cell = PSLinkCell;
                  detail = "GPTFloatBallPrefsRootListController";
                  icon = "ball_icon.png";
                  isController = 1;
                  label = "GPT悬浮球";
              };
          }
          ENTEOF

          cat > prefs/Resources/Info.plist << 'INFOEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>com.yourname.gptfloatball.prefs</string>
              <key>CFBundleName</key><string>GPTFloatBallPrefs</string>
              <key>CFBundlePackageType</key><string>BNDL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1.0.0</string>
          </dict>
          </plist>
          INFOEOF

          cat > prefs/Resources/Root.plist << 'ROOTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>基本设置</string></dict>
                  <dict>
                      <key>cell</key><string>PSSwitchCell</string>
                      <key>default</key><true/>
                      <key>defaults</key><string>com.yourname.gptfloatball</string>
                      <key>key</key><string>enabled</string>
                      <key>label</key><string>启用悬浮球</string>
                  </dict>
