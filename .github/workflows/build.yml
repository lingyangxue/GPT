name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-final
      - name: Theos
        uses: huami1314/theos-action@main
      - name: GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GPTFloatBall-deb
          path: packages/*.deb
