name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Force files
        run: |
          rm -rf prefs
          mkdir -p prefs/Resources

          cat > Makefile << 'MKEOF'
          export THEOS = $(CURDIR)/theos
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = SpringBoard
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = GPTFloatBall
          GPTFloatBall_FILES = Tweak.xm GPTChatViewController.m GPTSettings.m
          GPTFloatBall_FRAMEWORKS = UIKit Foundation CoreGraphics
          GPTFloatBall_CFLAGS = -fobjc-arc -Wno-deprecated-declarations
          GPTFloatBall_LIBRARIES = substrate
          include $(THEOS_MAKE_PATH)/tweak.mk
          SUBPROJECTS += prefs
          include $(THEOS_MAKE_PATH)/aggregate.mk
          MKEOF

          cat > GPTFloatBall.plist << 'PLEOF'
          { Filter = { Bundles = ( "com.apple.springboard" ); }; }
          PLEOF

          cat > GPTSettings.h << 'SETH'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          #define kPrefsDomain @"com.yourname.gptfloatball"
          static inline NSString *prefsPath(void) {
              return @"/var/mobile/Library/Preferences/com.yourname.gptfloatball.plist";
          }

          @interface GPTSettings : NSObject
          + (BOOL)isEnabled;
          + (NSString *)apiKey;
          + (NSString *)apiBaseURL;
          + (NSString *)modelName;
          + (NSString *)iconPath;
          + (NSString *)systemPrompt;
          + (double)temperature;
          + (NSInteger)maxTokens;
          + (CGFloat)ballSize;
          + (NSArray *)chatHistory;
          + (void)saveChatHistory:(NSArray *)history;
          + (void)clearHistory;
          + (void)setValue:(id)value forKey:(NSString *)key;
          @end
          SETH

          cat > GPTSettings.m << 'SETM'
          #import "GPTSettings.h"

          @implementation GPTSettings
          + (NSDictionary *)_readPrefs {
              NSDictionary *dict = [NSDictionary dictionaryWithContentsOfFile:prefsPath()];
              return dict ?: @{};
          }
          + (void)setValue:(id)value forKey:(NSString *)key {
              if (!key) return;
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:prefsPath()] ?: [NSMutableDictionary new];
              dict[key] = value ?: @"";
              [dict writeToFile:prefsPath() atomically:YES];
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
          }
          + (BOOL)isEnabled { NSNumber *v = [self _readPrefs][@"enabled"]; return v ? [v boolValue] : YES; }
          + (NSString *)apiKey { return [self _readPrefs][@"apiKey"] ?: @""; }
          + (NSString *)apiBaseURL {
              NSString *url = [self _readPrefs][@"apiBaseURL"];
              return url.length > 0 ? url : @"https://api.deepseek.com/v1/chat/completions";
          }
          + (NSString *)modelName {
              NSString *m = [self _readPrefs][@"modelName"];
              return m.length > 0 ? m : @"deepseek-chat";
          }
          + (NSString *)iconPath {
              NSString *p = [self _readPrefs][@"iconPath"];
              return p.length > 0 ? p : nil;
          }
          + (NSString *)systemPrompt {
              NSString *s = [self _readPrefs][@"systemPrompt"];
              return s.length > 0 ? s : @"你是一个简洁的AI助手，用中文回答。";
          }
          + (double)temperature {
              NSString *t = [self _readPrefs][@"temperature"];
              return t.length > 0 ? [t doubleValue] : 0.7;
          }
          + (NSInteger)maxTokens {
              NSString *t = [self _readPrefs][@"maxTokens"];
              return t.length > 0 ? [t integerValue] : 1024;
          }
          + (CGFloat)ballSize {
              NSString *s = [self _readPrefs][@"ballSize"];
              CGFloat v = s.length > 0 ? [s floatValue] : 60;
              if (v < 40) v = 40;
              if (v > 150) v = 150;
              return v;
          }
          + (NSArray *)chatHistory { return [self _readPrefs][@"chatHistory"] ?: @[]; }
          + (void)saveChatHistory:(NSArray *)history {
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:prefsPath()] ?: [NSMutableDictionary new];
              dict[@"chatHistory"] = history;
              [dict writeToFile:prefsPath() atomically:YES];
          }
          + (void)clearHistory {
              NSMutableDictionary *dict = [NSMutableDictionary dictionaryWithContentsOfFile:prefsPath()] ?: [NSMutableDictionary new];
              [dict removeObjectForKey:@"chatHistory"];
              [dict writeToFile:prefsPath() atomically:YES];
          }
          @end
          SETM

          cat > Tweak.xm << 'TWEAKEOF'
          #import <UIKit/UIKit.h>
          #import <roothide.h>
          #import "GPTSettings.h"
          #import "GPTChatViewController.h"

          static UIWindow *ballWin = nil;
          static UIWindow *chatWin = nil;

          @interface Ball : NSObject
          + (instancetype)shared;
          - (void)tap;
          - (void)pan:(UIPanGestureRecognizer *)g;
          @end

          @implementation Ball
          + (instancetype)shared {
              static Ball *i = nil; static dispatch_once_t t;
              dispatch_once(&t, ^{ i = [[Ball alloc] init]; });
              return i;
          }

          - (UIWindowScene *)scene {
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]] && s.activationState == UISceneActivationStateForegroundActive) {
                      return (UIWindowScene *)s;
                  }
              }
              for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) return (UIWindowScene *)s;
              }
              return nil;
          }

          - (void)tap {
              if (chatWin) return;
              UIWindowScene *s = [self scene];
              if (!s) return;
              GPTChatViewController *vc = [GPTChatViewController new];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:vc];
              chatWin = [[UIWindow alloc] initWithWindowScene:s];
              chatWin.frame = [UIScreen mainScreen].bounds;
              chatWin.windowLevel = UIWindowLevelAlert + 100;
              chatWin.rootViewController = nav;
              [chatWin makeKeyAndVisible];
              vc.dismissBlock = ^{
                  chatWin.hidden = YES;
                  chatWin = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if ([NSStringFromClass(w.class) containsString:@"System"] || w.windowLevel < UIWindowLevelAlert) {
                          [w makeKeyWindow];
                          break;
                      }
                  }
              };
          }

          - (void)pan:(UIPanGestureRecognizer *)g {
              UIView *v = g.view; UIWindow *w = v.window;
              CGPoint t = [g translationInView:w];
              w.center = CGPointMake(w.center.x + t.x, w.center.y + t.y);
              [g setTranslation:CGPointZero inView:w];
              if (g.state == UIGestureRecognizerStateEnded) {
                  CGSize sc = [UIScreen mainScreen].bounds.size;
                  CGFloat sz = [GPTSettings ballSize];
                  CGFloat x = w.frame.origin.x, y = w.frame.origin.y;
                  x = (x < sc.width/2) ? 10 : (sc.width - sz - 10);
                  y = MAX(60, MIN(y, sc.height - sz - 60));
                  [UIView animateWithDuration:0.25 animations:^{
                      w.frame = CGRectMake(x, y, sz, sz);
                  }];
                  NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
                  [d setFloat:x forKey:@"ballX"];
                  [d setFloat:y forKey:@"ballY"];
                  [d synchronize];
              }
          }
          @end

          static void makeBall(void) {
              if (ballWin) return;
              UIWindowScene *s = nil;
              for (UIScene *x in [UIApplication sharedApplication].connectedScenes) {
                  if ([x isKindOfClass:[UIWindowScene class]]) { s = (UIWindowScene *)x; break; }
              }
              if (!s) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1500000000), dispatch_get_main_queue(), ^{ makeBall(); });
                  return;
              }

              CGFloat sz = [GPTSettings ballSize];

              ballWin = [[UIWindow alloc] initWithWindowScene:s];
              ballWin.frame = CGRectMake(0, 0, sz, sz);
              ballWin.windowLevel = UIWindowLevelStatusBar + 100;
              ballWin.backgroundColor = [UIColor clearColor];
              ballWin.rootViewController = [UIViewController new];

              UIButton *b = [UIButton buttonWithType:UIButtonTypeCustom];
              b.frame = CGRectMake(0, 0, sz, sz);
              b.layer.cornerRadius = sz / 2.0;
              b.layer.masksToBounds = YES;
              b.backgroundColor = [UIColor colorWithRed:0.1 green:0.45 blue:0.91 alpha:0.9];

              NSString *iconPath = [GPTSettings iconPath];
              UIImage *icon = iconPath ? [UIImage imageWithContentsOfFile:iconPath] : nil;
              if (icon) {
                  [b setImage:icon forState:UIControlStateNormal];
                  b.imageView.contentMode = UIViewContentModeScaleAspectFill;
              } else {
                  [b setTitle:@"AI" forState:UIControlStateNormal];
                  [b setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  b.titleLabel.font = [UIFont boldSystemFontOfSize:MAX(14, sz * 0.3)];
              }

              [b addTarget:[Ball shared] action:@selector(tap) forControlEvents:UIControlEventTouchUpInside];
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:[Ball shared] action:@selector(pan:)];
              [b addGestureRecognizer:pan];
              [ballWin.rootViewController.view addSubview:b];

              NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
              CGFloat x = [d floatForKey:@"ballX"], y = [d floatForKey:@"ballY"];
              if (x == 0 && y == 0) {
                  CGSize sc = [UIScreen mainScreen].bounds.size;
                  x = sc.width - sz - 20;
                  y = sc.height / 2;
              }
              ballWin.frame = CGRectMake(x, y, sz, sz);
              ballWin.hidden = NO;
          }

          static void removeBall(void) {
              if (ballWin) { ballWin.hidden = YES; ballWin = nil; }
          }

          static void onSettingsChanged(CFNotificationCenterRef c, void *o, CFStringRef n, const void *obj, CFDictionaryRef u) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  removeBall();
                  makeBall();
              });
          }

          %ctor {
              %init;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(6 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ makeBall(); });
              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onSettingsChanged, CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
          }
          TWEAKEOF

          cat > GPTChatViewController.h << 'CHH'
          #import <UIKit/UIKit.h>
          @interface GPTChatViewController : UIViewController
          @property (nonatomic, copy) void (^dismissBlock)(void);
          @end
          CHH

          cat > GPTChatViewController.m << 'CHM'
          #import "GPTChatViewController.h"
          #import "GPTSettings.h"

          @interface GPTChatViewController () <UITableViewDelegate, UITableViewDataSource, UITextFieldDelegate>
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) NSMutableArray *messages;
          @property (nonatomic, strong) UITextField *inputField;
          @property (nonatomic, strong) UIView *bar;
          @end

          @implementation GPTChatViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"GPT 助手";
              self.view.backgroundColor = [UIColor systemBackgroundColor];
              self.navigationItem.leftBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemClose target:self action:@selector(close)];
              self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"清空" style:UIBarButtonItemStylePlain target:self action:@selector(clearAll)];
              self.messages = [NSMutableArray arrayWithArray:[GPTSettings chatHistory]];

              CGFloat W = self.view.bounds.size.width;
              CGFloat H = self.view.bounds.size.height;
              CGFloat safeB = self.view.safeAreaInsets.bottom;

              self.tableView = [[UITableView alloc] initWithFrame:CGRectMake(0, 0, W, H - 60) style:UITableViewStylePlain];
              self.tableView.delegate = self;
              self.tableView.dataSource = self;
              self.tableView.rowHeight = UITableViewAutomaticDimension;
              self.tableView.estimatedRowHeight = 60;
              self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:self.tableView];

              self.bar = [[UIView alloc] initWithFrame:CGRectMake(0, H - 60 - safeB, W, 60 + safeB)];
              self.bar.backgroundColor = [UIColor secondarySystemBackgroundColor];
              self.bar.autoresizingMask = UIViewAutoresizingFlexibleTopMargin | UIViewAutoresizingFlexibleWidth;
              [self.view addSubview:self.bar];

              self.inputField = [[UITextField alloc] initWithFrame:CGRectMake(12, 10, W - 130, 40)];
              self.inputField.placeholder = @"输入消息...";
              self.inputField.borderStyle = UITextBorderStyleRoundedRect;
              self.inputField.delegate = self;
              self.inputField.returnKeyType = UIReturnKeySend;
              self.inputField.autoresizingMask = UIViewAutoresizingFlexibleWidth;
              self.inputField.backgroundColor = [UIColor systemBackgroundColor];
              [self.bar addSubview:self.inputField];

              UIButton *polishBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              polishBtn.frame = CGRectMake(W - 108, 10, 48, 40);
              [polishBtn setTitle:@"润色" forState:UIControlStateNormal];
              [polishBtn addTarget:self action:@selector(polishText) forControlEvents:UIControlEventTouchUpInside];
              polishBtn.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              [self.bar addSubview:polishBtn];

              UIButton *sendBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              sendBtn.frame = CGRectMake(W - 56, 10, 48, 40);
              [sendBtn setTitle:@"发送" forState:UIControlStateNormal];
              [sendBtn addTarget:self action:@selector(sendMessage) forControlEvents:UIControlEventTouchUpInside];
              sendBtn.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
              [self.bar addSubview:sendBtn];

              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(kbShow:) name:UIKeyboardWillShowNotification object:nil];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(kbHide:) name:UIKeyboardWillHideNotification object:nil];
          }

          - (void)viewDidAppear:(BOOL)animated {
              [super viewDidAppear:animated];
              [self.inputField becomeFirstResponder];
          }

          - (void)kbShow:(NSNotification *)n {
              CGRect kb = [n.userInfo[UIKeyboardFrameEndUserInfoKey] CGRectValue];
              CGFloat h = kb.size.height;
              [UIView animateWithDuration:0.25 animations:^{
                  self.bar.transform = CGAffineTransformMakeTranslation(0, -h);
                  self.tableView.contentInset = UIEdgeInsetsMake(0, 0, h, 0);
                  self.tableView.scrollIndicatorInsets = self.tableView.contentInset;
              }];
          }

          - (void)kbHide:(NSNotification *)n {
              [UIView animateWithDuration:0.25 animations:^{
                  self.bar.transform = CGAffineTransformIdentity;
                  self.tableView.contentInset = UIEdgeInsetsZero;
                  self.tableView.scrollIndicatorInsets = UIEdgeInsetsZero;
              }];
          }

          - (void)close { if (self.dismissBlock) self.dismissBlock(); }
          - (void)clearAll { [self.messages removeAllObjects]; [GPTSettings clearHistory]; [self.tableView reloadData]; }

          - (void)polishText {
              NSString *text = [self.inputField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (text.length == 0) return;
              if ([GPTSettings apiKey].length == 0) { [self alert:@"请先在设置里填 API Key"]; return; }
              self.inputField.text = @"";
              NSArray *msgs = @[
                  @{@"role": @"system", @"content": @"你是一个专业的中文润色助手。请对用户提供的文本进行润色，使其更通顺、优美、专业，只返回润色后的文本。"},
                  @{@"role": @"user", @"content": text}
              ];
              [self callAPI:msgs isPolish:YES];
          }

          - (void)sendMessage {
              NSString *text = [self.inputField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (text.length == 0) return;
              if ([GPTSettings apiKey].length == 0) { [self alert:@"请先在设置里填 API Key"]; return; }
              self.inputField.text = @"";
              [self.messages addObject:@{@"role": @"user", @"content": text}];
              [self.tableView reloadData];

              NSMutableArray *msgs = [NSMutableArray array];
              [msgs addObject:@{@"role": @"system", @"content": [GPTSettings systemPrompt]}];
              for (NSDictionary *m in self.messages) [msgs addObject:m];
              [self callAPI:msgs isPolish:NO];
          }

          - (void)callAPI:(NSArray *)msgs isPolish:(BOOL)isPolish {
              NSDictionary *body = @{
                  @"model": [GPTSettings modelName],
                  @"messages": msgs,
                  @"temperature": @([GPTSettings temperature]),
                  @"max_tokens": @([GPTSettings maxTokens])
              };
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:[GPTSettings apiBaseURL]]];
              req.HTTPMethod = @"POST";
              [req setValue:@"application/json" forHTTPHeaderField:@"Content-Type"];
              [req setValue:[NSString stringWithFormat:@"Bearer %@", [GPTSettings apiKey]] forHTTPHeaderField:@"Authorization"];
              req.HTTPBody = [NSJSONSerialization dataWithJSONObject:body options:0 error:nil];
              req.timeoutInterval = 60;

              [[[NSURLSession sharedSession] dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (err) { [self alert:[NSString stringWithFormat:@"网络错误: %@", err.localizedDescription]]; return; }
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSString *reply = json[@"choices"][0][@"message"][@"content"];
                      if (reply.length == 0) {
                          NSString *e = json[@"error"][@"message"];
                          [self alert:e.length > 0 ? e : @"未收到有效回复"];
                          return;
                      }
                      if (isPolish) {
                          self.inputField.text = reply;
                          [self.inputField becomeFirstResponder];
                      } else {
                          [self.messages addObject:@{@"role": @"assistant", @"content": reply}];
                          [GPTSettings saveChatHistory:self.messages];
                          [self.tableView reloadData];
                          if (self.messages.count > 0) {
                              NSIndexPath *last = [NSIndexPath indexPathForRow:self.messages.count - 1 inSection:0];
                              [self.tableView scrollToRowAtIndexPath:last atScrollPosition:UITableViewScrollPositionBottom animated:YES];
                          }
                      }
                  });
              }] resume];
          }

          - (void)alert:(NSString *)msg {
              UIAlertController *a = [UIAlertController alertControllerWithTitle:@"提示" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [a addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:a animated:YES completion:nil];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)tf { [self sendMessage]; return YES; }
          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return self.messages.count; }

          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              static NSString *cid = @"c";
              UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:cid];
              if (!cell) {
                  cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:cid];
                  cell.textLabel.numberOfLines = 0;
                  cell.textLabel.font = [UIFont systemFontOfSize:15];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;
              }
              NSDictionary *m = self.messages[ip.row];
              BOOL isUser = [m[@"role"] isEqualToString:@"user"];
              cell.textLabel.text = isUser ? [NSString stringWithFormat:@"你: %@", m[@"content"]] : [NSString stringWithFormat:@"GPT: %@", m[@"content"]];
              cell.textLabel.textColor = isUser ? [UIColor systemBlueColor] : [UIColor labelColor];
              return cell;
          }

          @end
          CHM

          cat > prefs/Makefile << 'PMEOF'
          include $(THEOS)/makefiles/common.mk
          BUNDLE_NAME = GPTFloatBallPrefs
          GPTFloatBallPrefs_FILES = Ctrl.m
          GPTFloatBallPrefs_INSTALL_PATH = /Library/PreferenceBundles
          GPTFloatBallPrefs_FRAMEWORKS = UIKit
          GPTFloatBallPrefs_CFLAGS = -fobjc-arc
          GPTFloatBallPrefs_LDFLAGS = -Wl,-undefined,dynamic_lookup
          include $(THEOS_MAKE_PATH)/bundle.mk
          internal-stage::
          	$(ECHO_NOTHING)mkdir -p $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences$(ECHO_END)
          	$(ECHO_NOTHING)cp entry.plist $(THEOS_STAGING_DIR)/Library/PreferenceLoader/Preferences/GPTFloatBall.plist$(ECHO_END)
          PMEOF

          cat > prefs/entry.plist << 'ENTEOF'
          { entry = { bundle = "GPTFloatBallPrefs"; cell = PSLinkCell; detail = "GPTFloatBallPrefsRootListController"; icon = "ball_icon.png"; isController = 1; label = "GPT悬浮球"; }; }
          ENTEOF

          cat > prefs/Resources/Info.plist << 'INFOEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>GPTFloatBallPrefs</string>
          <key>CFBundleIdentifier</key><string>com.yourname.gptfloatball.prefs</string>
          <key>CFBundleName</key><string>GPTFloatBallPrefs</string>
          <key>CFBundlePackageType</key><string>BNDL</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundleVersion</key><string>1.0.0</string>
          </dict></plist>
          INFOEOF

          cat > prefs/Resources/Root.plist << 'ROOTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>基本设置</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>default</key><true/><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>enabled</string><key>label</key><string>启用悬浮球</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>API 配置</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>apiKey</string><key>label</key><string>API Key</string><key>placeholder</key><string>sk-xxxxxxxx</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>apiBaseURL</string><key>label</key><string>API 地址</string><key>placeholder</key><string>https://api.deepseek.com/v1/chat/completions</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>modelName</string><key>label</key><string>当前模型</string><key>placeholder</key><string>deepseek-chat</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>获取模型列表</string><key>action</key><string>fetchModelList</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>systemPrompt</string><key>label</key><string>角色预设</string><key>placeholder</key><string>你是一个简洁的AI助手，用中文回答。</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>temperature</string><key>label</key><string>温度</string><key>placeholder</key><string>0.7</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>maxTokens</string><key>label</key><string>最大 tokens</string><key>placeholder</key><string>1024</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>悬浮球外观</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>ballSize</string><key>label</key><string>悬浮球大小</string><key>placeholder</key><string>60</string><key>get</key><string>readPreferenceValue:</string><key>set</key><string>setPreferenceValue:specifier:</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>从相册选择悬浮球图标</string><key>action</key><string>pickImage</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>数据管理</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>清除对话记录</string><key>action</key><string>clearHistory</string></dict>
          </array><key>title</key><string>GPT悬浮球</string></dict></plist>
          ROOTEOF

          cat > prefs/Ctrl.m << 'CTLEOF'
          #import <Preferences/PSListController.h>
          #import <Preferences/PSSpecifier.h>
          #import <UIKit/UIKit.h>

          #define kDomain @"com.yourname.gptfloatball"
          #define kPlist @"/var/mobile/Library/Preferences/com.yourname.gptfloatball.plist"
          #define kIcon @"/var/mobile/Library/Preferences/GPTFloatBall_icon.png"

          @interface GPTFloatBallPrefsRootListController : PSListController <UIImagePickerControllerDelegate, UINavigationControllerDelegate>
          @end

          @implementation GPTFloatBallPrefsRootListController

          - (NSArray *)specifiers {
              if (!_specifiers) {
                  _specifiers = [self loadSpecifiersFromPlistName:@"Root" target:self];
              }
              return _specifiers;
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"应用更改" style:UIBarButtonItemStyleDone target:self action:@selector(apply)];
          }

          - (void)apply {
              [self.view endEditing:YES];
              [[[NSUserDefaults alloc] initWithSuiteName:kDomain] synchronize];
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
              UIAlertController *a = [UIAlertController alertControllerWithTitle:@"已保存" message:@"设置已生效，悬浮球已刷新" preferredStyle:UIAlertControllerStyleAlert];
              [a addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:a animated:YES completion:nil];
          }

          - (id)readPreferenceValue:(PSSpecifier *)s {
              NSDictionary *p = [NSDictionary dictionaryWithContentsOfFile:kPlist] ?: @{};
              NSString *k = [s propertyForKey:@"key"]; if (!k) return nil;
              id v = p[k]; if (!v) v = [s propertyForKey:@"default"];
              return v;
          }

          - (void)setPreferenceValue:(id)v specifier:(PSSpecifier *)s {
              NSString *k = [s propertyForKey:@"key"]; if (!k) return;
              NSMutableDictionary *p = [NSMutableDictionary dictionaryWithContentsOfFile:kPlist] ?: [NSMutableDictionary new];
              p[k] = v; [p writeToFile:kPlist atomically:YES];
              CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
          }

          - (void)pickImage {
              UIImagePickerController *p = [[UIImagePickerController alloc] init];
              p.sourceType = UIImagePickerControllerSourceTypePhotoLibrary;
              p.delegate = self;
              p.allowsEditing = YES;
              [self presentViewController:p animated:YES completion:nil];
          }

          - (void)imagePickerController:(UIImagePickerController *)picker didFinishPickingMediaWithInfo:(NSDictionary<UIImagePickerControllerInfoKey,id> *)info {
              UIImage *img = info[UIImagePickerControllerEditedImage] ?: info[UIImagePickerControllerOriginalImage];
              [picker dismissViewControllerAnimated:YES completion:^{
                  if (!img) return;
                  UIGraphicsBeginImageContextWithOptions(CGSizeMake(200, 200), NO, 1.0);
                  [img drawInRect:CGRectMake(0, 0, 200, 200)];
                  UIImage *scaled = UIGraphicsGetImageFromCurrentImageContext();
                  UIGraphicsEndImageContext();
                  NSData *data = UIImagePNGRepresentation(scaled);
                  [data writeToFile:kIcon atomically:YES];
                  NSMutableDictionary *p = [NSMutableDictionary dictionaryWithContentsOfFile:kPlist] ?: [NSMutableDictionary new];
                  p[@"iconPath"] = kIcon;
                  [p writeToFile:kPlist atomically:YES];
                  CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
                  UIAlertController *a = [UIAlertController alertControllerWithTitle:@"成功" message:@"图标已更新" preferredStyle:UIAlertControllerStyleAlert];
                  [a addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:a animated:YES completion:nil];
              }];
          }

          - (void)imagePickerControllerDidCancel:(UIImagePickerController *)picker {
              [picker dismissViewControllerAnimated:YES completion:nil];
          }

          - (void)fetchModelList {
              [self.view endEditing:YES];
              NSDictionary *p = [NSDictionary dictionaryWithContentsOfFile:kPlist] ?: @{};
              NSString *key = p[@"apiKey"] ?: @"";
              NSString *base = p[@"apiBaseURL"] ?: @"https://api.deepseek.com/v1/chat/completions";
              if (key.length == 0) { [self tip:@"请先填 API Key"]; return; }
              NSString *u = [base stringByReplacingOccurrencesOfString:@"/chat/completions" withString:@"/models"];
              NSMutableURLRequest *r = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:u]];
              [r setValue:[NSString stringWithFormat:@"Bearer %@", key] forHTTPHeaderField:@"Authorization"];
              UIAlertController *load = [UIAlertController alertControllerWithTitle:@"获取中..." message:nil preferredStyle:UIAlertControllerStyleAlert];
              [self presentViewController:load animated:YES completion:nil];
              [[[NSURLSession sharedSession] dataTaskWithRequest:r completionHandler:^(NSData *d, NSURLResponse *rs, NSError *e) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [load dismissViewControllerAnimated:YES completion:^{
                          if (e) { [self tip:e.localizedDescription]; return; }
                          NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          NSArray *arr = j[@"data"];
                          if (![arr isKindOfClass:[NSArray class]]) { [self tip:@"获取失败"]; return; }
                          UIAlertController *s = [UIAlertController alertControllerWithTitle:@"选择模型" message:nil preferredStyle:UIAlertControllerStyleActionSheet];
                          for (NSDictionary *m in arr) {
                              NSString *mid = m[@"id"]; if (mid.length == 0) continue;
                              [s addAction:[UIAlertAction actionWithTitle:mid style:UIAlertActionStyleDefault handler:^(UIAlertAction *_) {
                                  NSMutableDictionary *pp = [NSMutableDictionary dictionaryWithContentsOfFile:kPlist] ?: [NSMutableDictionary new];
                                  pp[@"modelName"] = mid; [pp writeToFile:kPlist atomically:YES];
                                  CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR("com.yourname.gptfloatball/settingsChanged"), NULL, NULL, YES);
                                  [self reloadSpecifiers];
                              }]];
                          }
                          [s addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                          s.popoverPresentationController.sourceView = self.view;
                          s.popoverPresentationController.sourceRect = CGRectMake(self.view.bounds.size.width/2, self.view.bounds.size.height/2, 1, 1);
                          [self presentViewController:s animated:YES completion:nil];
                      }];
                  });
              }] resume];
          }

          - (void)tip:(NSString *)m {
              UIAlertController *a = [UIAlertController alertControllerWithTitle:@"提示" message:m preferredStyle:UIAlertControllerStyleAlert];
              [a addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:a animated:YES completion:nil];
          }

          - (void)clearHistory {
              NSMutableDictionary *d = [NSMutableDictionary dictionaryWithContentsOfFile:kPlist] ?: [NSMutableDictionary new];
              [d removeObjectForKey:@"chatHistory"]; [d writeToFile:kPlist atomically:YES];
              [self apply];
          }

          @end
          CTLEOF

          cp prefs/entry.plist ./entry.plist
          ls -la prefs/

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-v13

      - name: Theos
        uses: huami1314/theos-action@main

      - name: GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GPTFloatBall-deb
          path: packages/*.deb
