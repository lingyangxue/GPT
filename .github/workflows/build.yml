name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Write Root.plist
        run: |
          cat > prefs/Resources/Root.plist << 'REOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>基本设置</string></dict>
          <dict><key>cell</key><string>PSSwitchCell</string><key>default</key><true/><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>enabled</string><key>label</key><string>启用悬浮球</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>API 配置</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>apiKey</string><key>label</key><string>API Key</string><key>placeholder</key><string>sk-xxxxxxxx</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>apiBaseURL</string><key>label</key><string>API 地址</string><key>placeholder</key><string>https://api.deepseek.com/v1/chat/completions</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>modelName</string><key>label</key><string>模型</string><key>placeholder</key><string>deepseek-chat</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>获取模型列表</string><key>action</key><string>fetchModelList</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>systemPrompt</string><key>label</key><string>角色预设</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>temperature</string><key>label</key><string>温度</string><key>placeholder</key><string>0.7</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>maxTokens</string><key>label</key><string>最大 tokens</string><key>placeholder</key><string>1024</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>悬浮球外观</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>ballSize</string><key>label</key><string>大小 40-150</string><key>placeholder</key><string>60</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>ballOpacity</string><key>label</key><string>透明度 0.1-1.0</string><key>placeholder</key><string>0.9</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>从相册选择悬浮球图标</string><key>action</key><string>pickImage</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>聊天窗口 0.5-1.0</string></dict>
          <dict><key>cell</key><string>PSEditTextCell</string><key>defaults</key><string>com.yourname.gptfloatball</string><key>key</key><string>windowScale</string><key>label</key><string>窗口缩放</string><key>placeholder</key><string>1.0</string></dict>
          <dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>数据管理</string></dict>
          <dict><key>cell</key><string>PSButtonCell</string><key>label</key><string>清除对话记录</string><key>action</key><string>clearHistory</string></dict>
          </array><key>title</key><string>GPT悬浮球</string></dict></plist>
          REOF
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-final
      - name: Theos
        uses: huami1314/theos-action@main
      - name: GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GPTFloatBall-deb
          path: packages/*.deb